<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">

  <title>Receptenboek</title>
  <meta name="description" content="Persoonlijk receptenboek">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- GitHub Pages compatible version -->

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
    }

    #timerBanner {
      display: none;
      background: #ab7c7c;
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .cat-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .cat-pill {
      display: flex;
      align-items: center;
      background: #2d2d2d;
      border: 1px solid #ab7c7c;
      border-radius: 8px;
      overflow: hidden;
    }

    .cat-pill.active {
      background: #ab7c7c;
    }

    .cat-btn {
      background: transparent;
      color: #ab7c7c;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .cat-pill.active .cat-btn {
      color: #fff;
    }

    .cat-del-btn {
      background: transparent;
      border: none;
      color: #d9534f;
      padding: 0 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .alphabet-nav {
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .alphabet-btn {
      background: #2d2d2d;
      color: #ab7c7c;
      border: 1px solid #ab7c7c;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .alphabet-btn:hover:not(:disabled) {
      background: #ab7c7c;
      color: #fff;
    }

    .alphabet-btn:disabled {
      background: #222;
      color: #555;
      border-color: #333;
      cursor: not-allowed;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2d2d2d;
      color: #fff;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }

    .carousel {
      max-width: 600px;
      margin: 0 auto;
    }

    .recipe {
      display: none;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      text-align: left;
      margin-bottom: 1rem;
    }

    .recipe.active {
      display: block;
    }

    .recipe h2 {
      color: #fff;
      margin-top: 0;
    }

    .recipe h3 {
      color: #ab7c7c;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
      margin-top: 1.2rem;
    }

    .step-frame {
      background-color: #363636;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      margin-top: 0.8rem;
    }

    .step-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid #444;
      padding-bottom: 0.4rem;
    }

    .step-number-kader {
      font-weight: bold;
      color: #ab7c7c;
      margin-right: 0.8rem;
    }

    .step-title-display {
      font-weight: bold;
      color: #fff;
    }

    .step-list {
      margin: 0;
      padding-left: 1.2rem;
      color: #ccc;
      line-height: 1.5;
    }

    .nav-btn,
    .save-recipe-btn,
    .add-step-btn,
    .remove-step-btn,
    .restore-btn,
    .timer-btn,
    .edit-btn,
    #toggleAdd,
    #toggleTrash,
    #toggleShoplist {
      background: #ab7c7c;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }

    .timer-btn {
      background: #4a7c59;
      padding: 4px 8px;
      font-size: 0.8rem;
      margin-left: 8px;
    }

    .edit-btn {
      background: #f0ad4e;
    }

    .remove-step-btn {
      background: #d9534f;
    }

    .restore-btn {
      background: #5cb85c;
    }

    #addForm,
    #shoplistView {
      max-width: 600px;
      margin: 2rem auto;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 16px;
      text-align: left;
      display: none;
    }

    #addForm.show,
    #shoplistView.show {
      display: block;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #363636;
      color: #fff;
      box-sizing: border-box;
    }

    .step-input-group {
      background: #363636;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .shop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #363636;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .shop-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      cursor: pointer;
    }
  </style>

  <script>
    // Globale applicatiestatus
    var recipes = [];
    var trashRecipes = [];
    var shoppingList = [];
    var index = 0;
    var huidigeCategorie = "Overig";

    var appState = {
      inTrashView: false,
      inShoplistView: false
    };

    var activeTimer = null;
    var timeLeft = 0;
    var isPaused = false;
    var currentRecipeName = "";
    var db = null;

    try {
      trashRecipes = JSON.parse(
        localStorage.getItem('myTrashRecipes') || '[]'
      );

      shoppingList = JSON.parse(
        localStorage.getItem('myShoplist') || '[]'
      );
    } catch(e) {
      trashRecipes = [];
      shoppingList = [];
    }
  </script>
</head>

<body>

  <h1>Receptenboek</h1>

  <p id="subTitle">
    Kies een categorie of blader door je recepten.
  </p>

  <!-- TIMER -->

  <div id="timerBanner">
    <span id="timerText"></span>

    <div style="margin-top: 5px; display: flex; justify-content: center; gap: 5px;">

      <button
        id="timerPauseBtn"
        onclick="togglePauseTimer()"
        style="background:#333; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;"
      >
        Pauze
      </button>

      <button
        onclick="stopTimer()"
        style="background:#d9534f; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;"
      >
        Stoppen
      </button>

    </div>
  </div>

  <!-- CATEGORIEËN -->

  <div class="cat-nav" id="catNav"></div>

  <!-- ZOEKEN -->

  <input
    type="text"
    id="search"
    placeholder="Zoek op titel, ingrediënt of categorie..."
    oninput="renderApp()"
  >

  <!-- ALFABET -->

  <div class="alphabet-nav" id="alphabetNav"></div>

  <!-- KNOPPEN -->

  <div style="margin-bottom: 1.5rem;">

    <button
      id="toggleAdd"
      onclick="openAddForm()"
    >
      + Recept toevoegen
    </button>

    <button
      id="toggleShoplist"
      onclick="toggleShoplistView()"
    >
      🛒 Boodschappenlijst (0)
    </button>

    <button
      id="toggleTrash"
      onclick="toggleTrashView()"
    >
      🗑️ Prullenbak (0)
    </button>

  </div>

  <!-- BOODSCHAPPENLIJST -->

  <div id="shoplistView">

    <h2>Boodschappenlijst</h2>

    <div
      id="shoplistIngredientsContainer"
      style="margin-bottom: 15px;"
    ></div>

    <h3 style="margin-top: 1rem; color:#fff;">
      Jouw actieve lijst:
    </h3>

    <ul
      id="finalShoplist"
      class="step-list"
      style="margin-bottom: 15px;"
    ></ul>

    <button
      class="remove-step-btn"
      onclick="clearShoplist()"
      style="width:100%"
    >
      Lijst leegmaken
    </button>

  </div>

  <!-- RECEPT TOEVOEGEN / BEWERKEN -->

  <div id="addForm">

    <h2 id="formTitle">
      Nieuw recept
    </h2>

    <input
      type="hidden"
      id="editRecipeId"
      value=""
    >

    <input
      type="text"
      id="newTitle"
      placeholder="Titel van recept"
    >

    <input
      type="text"
      id="newCat"
      placeholder="Categorie (bijv. Pasta, Salade)"
      list="catList"
    >

    <datalist id="catList"></datalist>

    <input
      type="text"
      id="newTime"
      placeholder="Bereidingstijd (bijv. 20 min)"
    >

    <input
      type="text"
      id="newDifficulty"
      placeholder="Moeilijkheid (bijv. Makkelijk)"
    >

    <textarea
      id="newIngredients"
      placeholder="Ingrediënten (één per regel)"
      rows="4"
    ></textarea>

    <label style="font-weight: bold; color: #ccc;">
      Bereidingsstappen:
    </label>

    <div
      id="stepsInputContainer"
      style="margin-top: 0.5rem;"
    ></div>

    <button
      type="button"
      class="add-step-btn"
      onclick="addStepInput()"
    >
      + Stap toevoegen
    </button>

    <button
      class="save-recipe-btn"
      onclick="saveRecipe()"
      style="width:100%"
    >
      Opslaan
    </button>

  </div>

  <!-- RECEPTEN -->

  <div
    class="carousel"
    id="carousel"
  ></div>

  <!-- PAGINERING -->

  <div
    style="margin-top: 20px;"
    id="paginationContainer"
  >

    <button
      id="prev"
      class="nav-btn"
    >
      ◀ Vorige
    </button>

    <button
      id="next"
      class="nav-btn"
    >
      Volgende ▶
    </button>

    <div
      id="counter"
      style="margin-top: 10px; color: #aaa;"
    ></div>

  </div>


  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->

  <script>

    // =========================================================
    // SUPABASE INITIALISATIE
    // =========================================================

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        try {

          const supabaseUrl =
            'https://tnwdxmzvrmfwpwhcmkto.supabase.co';

          const supabaseKey =
            'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX';

          if (
            !window.supabase ||
            typeof window.supabase.createClient !== 'function'
          ) {

            console.error(
              "Supabase SDK kon niet worden geladen."
            );

            alert(
              "Supabase kon niet worden geladen. Controleer je internetverbinding of de CDN-link."
            );

            return;
          }

          try {

            const parsedUrl =
              new URL(supabaseUrl);

            if (
              !/^https?:$/.test(
                parsedUrl.protocol
              )
            ) {

              throw new Error(
                "Supabase URL moet met http:// of https:// beginnen."
              );

            }

            db =
              window.supabase.createClient(
                supabaseUrl,
                supabaseKey
              );

            await fetchRecipes();

          } catch (err) {

            console.error(
              "Fout bij Supabase setup:",
              err
            );

            alert(
              "Supabase kon niet worden gestart: " +
              err.message
            );

          }

        } catch (err) {

          console.error(
            "Fout bij Supabase setup:",
            err
          );

        }

      }
    );


    // =========================================================
    // RECEPTEN OPHALEN
    // =========================================================

    async function fetchRecipes() {

      if (!db) return;

      const {
        data,
        error
      } =
        await db
          .from('recepten')
          .select('*');

      if (error) {

        console.error(
          "Fout bij ophalen:",
          error
        );

        alert(
          "De recepten konden niet worden geladen uit Supabase. " +
          "Controleer de Supabase URL, publishable key en RLS-beleid." +
          "\n\nFout: " +
          error.message
        );

        return;
      }

      recipes =
        data || [];

      document.getElementById(
        "toggleTrash"
      ).textContent =
        `🗑️ Prullenbak (${trashRecipes.length})`;

      updateShoplistCount();

      renderApp();

    }


    // =========================================================
    // HTML VEILIG MAKEN
    // =========================================================

    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    // =========================================================
    // DYNAMISCHE KNOPPEN
    // =========================================================

    function bindDynamicButtons() {

      document
        .querySelectorAll('.cat-btn')
        .forEach(btn => {

          btn.addEventListener(
            'click',
            () =>
              selectCategory(
                btn.dataset.category
              )
          );

        });


      document
        .querySelectorAll('[data-delete-category]')
        .forEach(btn => {

          btn.addEventListener(
            'click',
            (event) =>
              verwijderCategorie(
                event,
                btn.dataset.deleteCategory
              )
          );

        });


      document
        .querySelectorAll('.timer-btn')
        .forEach(btn => {

          btn.addEventListener(
            'click',
            () =>
              startTimer(
                Number(
                  btn.dataset.timerMinutes
                ),
                btn.dataset.timerName
              )
          );

        });


      document
        .querySelectorAll('.add-shop-btn')
        .forEach(btn => {

          btn.addEventListener(
            'click',
            () => {

              const recipe =
                gefilterdeForCurrentView()[
                  Number(
                    btn.dataset.recipeIndex
                  )
                ];

              if (recipe) {

                openShoplistModal(
                  parseIng(
                    recipe.ingredienten
                  )
                );

              }

            }
          );

        });

    }


    // =========================================================
    // HUIDIGE FILTER
    // =========================================================

    function gefilterdeForCurrentView() {

      const searchTerm =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();

      if (searchTerm) {

        return recipes.filter(r => {

          const titelMatch =
            r.titel &&
            r.titel
              .toLowerCase()
              .includes(searchTerm);

          const catMatch =
            r.categorie &&
            r.categorie
              .toLowerCase()
              .includes(searchTerm);

          let ingString = "";

          try {

            ingString =
              parseIng(
                r.ingredienten
              )
              .join(" ")
              .toLowerCase();

          } catch(e) {}


          let stepString = "";

          try {

            stepString =
              parseStepsRaw(
                r.bereiding
              )
              .join(" ")
              .toLowerCase();

          } catch(e) {}


          return (
            titelMatch ||
            catMatch ||
            ingString.includes(searchTerm) ||
            stepString.includes(searchTerm)
          );

        });

      }

      return recipes.filter(
        r =>
          (r.categorie || "Overig") ===
          huidigeCategorie
      );

    }


    // =========================================================
    // APP RENDEREN
    // =========================================================

    function renderApp() {

      const searchEl =
        document.getElementById("search");

      const searchTerm =
        searchEl
          ? searchEl.value.toLowerCase().trim()
          : "";

      const catNavElement =
        document.getElementById("catNav");

      const alphabetNavElement =
        document.getElementById("alphabetNav");

      const paginationElement =
        document.getElementById(
          "paginationContainer"
        );

      const addFormElement =
        document.getElementById("addForm");

      const shoplistElement =
        document.getElementById(
          "shoplistView"
        );


      // =====================================================
      // PRULLENBAK / BOODSCHAPPENLIJST
      // =====================================================

      if (
        appState.inTrashView ||
        appState.inShoplistView
      ) {

        catNavElement.style.display =
          "none";

        alphabetNavElement.style.display =
          "none";

        paginationElement.style.display =
          "none";

        addFormElement.classList.remove(
          "show"
        );


        if (appState.inTrashView) {

          document.getElementById(
            "subTitle"
          ).textContent =
            "Verwijderde recepten in de prullenbak:";

          shoplistElement.classList.remove(
            "show"
          );

          renderTrashList(
            searchTerm
          );

        } else {

          document.getElementById(
            "subTitle"
          ).textContent =
            "Jouw geselecteerde boodschappenlijst:";

          renderShoplistUI();

        }

        return;

      } else {

        catNavElement.style.display =
          "flex";

        alphabetNavElement.style.display =
          "flex";

        shoplistElement.classList.remove(
          "show"
        );

        document.getElementById(
          "subTitle"
        ).textContent =
          "Kies een categorie of blader door je recepten.";

        paginationElement.style.display =
          "block";

      }


      // =====================================================
      // CATEGORIEËN
      // =====================================================

      let cats = [
        ...new Set(
          recipes
            .map(r => r.categorie)
            .filter(
              c =>
                c &&
                c.trim() !== ""
            )
        )
      ];


      if (cats.length === 0) {

        cats = ["Overig"];

      }


      if (cats.includes("Overig")) {

        cats =
          cats.filter(
            c =>
              c !== "Overig"
          );

        cats.push("Overig");

      }


      if (
        !cats.includes(
          huidigeCategorie
        )
      ) {

        huidigeCategorie =
          cats[0];

      }


      catNavElement.innerHTML =
        cats
          .map(c => `

        <div class="cat-pill ${
          huidigeCategorie === c
            ? 'active'
            : ''
        }">

          <button
            class="cat-btn"
            data-category="${escapeHtml(c)}"
          >
            ${escapeHtml(c)}
          </button>

          ${
            c !== "Overig"
              ? `
                <button
                  class="cat-del-btn"
                  data-delete-category="${escapeHtml(c)}"
                  title="Verwijder categorie"
                >
                  🗑️
                </button>
              `
              : ''
          }

        </div>

      `)
      .join("");


      document.getElementById(
        "catList"
      ).innerHTML =
        cats
          .map(
            c =>
              `<option value="${c}">`
          )
          .join("");


      // =====================================================
      // RECEPTEN FILTEREN
      // =====================================================

      let gefilterde = [];


      if (searchTerm) {

        gefilterde =
          recipes.filter(r => {

            const titelMatch =
              r.titel &&
              r.titel
                .toLowerCase()
                .includes(searchTerm);

            const catMatch =
              r.categorie &&
              r.categorie
                .toLowerCase()
                .includes(searchTerm);


            let ingString = "";

            try {

              ingString =
                parseIng(
                  r.ingredienten
                )
                .join(" ")
                .toLowerCase();

            } catch(e) {

              ingString =
                (
                  r.ingredienten ||
                  ""
                )
                .toLowerCase();

            }


            let stepString = "";

            try {

              stepString =
                parseStepsRaw(
                  r.bereiding
                )
                .join(" ")
                .toLowerCase();

            } catch(e) {

              stepString =
                (
                  r.bereiding ||
                  ""
                )
                .toLowerCase();

            }


            return (
              titelMatch ||
              catMatch ||
              ingString.includes(searchTerm) ||
              stepString.includes(searchTerm)
            );

          });

      } else {

        gefilterde =
          recipes.filter(
            r =>
              (r.categorie || "Overig") ===
              huidigeCategorie
          );

      }


      renderAlphabetNav(
        gefilterde
      );


      const carousel =
        document.getElementById(
          "carousel"
        );

      const counter =
        document.getElementById(
          "counter"
        );


      if (
        gefilterde.length === 0
      ) {

        carousel.innerHTML =
          `
            <div class="recipe active">
              <p>Geen recepten gevonden.</p>
            </div>
          `;

        counter.textContent =
          "";

        return;

      }


      if (
        index >= gefilterde.length
      ) {

        index = 0;

      }


      // =====================================================
      // RECEPTEN HTML
      // =====================================================

      carousel.innerHTML =
        gefilterde
          .map((r, i) => {

            let ingList =
              parseIng(
                r.ingredienten
              );


            let ingHtml =
              ingList
                .map(
                  x =>
                    `<li>${escapeHtml(
                      String(x).replace(
                        /["\[\]]/g,
                        ''
                      )
                    )}</li>`
                )
                .join("");


            let stepsHtml =
              parseSteps(
                r.bereiding
              );


            let metaInfo = [];


            if (r.categorie) {

              metaInfo.push(
                `<strong>Categorie:</strong> ${
                  escapeHtml(
                    r.categorie
                  )
                }`
              );

            }


            if (r.tijd) {

              let minutes =
                extractMinutes(
                  r.tijd
                );


              let timerBtnHtml =
                minutes > 0
                  ? `
                    <button
                      class="timer-btn"
                      data-timer-minutes="${minutes}"
                      data-timer-name="${escapeHtml(
                        r.titel || "Recept"
                      )}"
                    >
                      ⏱️ Start (${minutes}m)
                    </button>
                  `
                  : '';


              metaInfo.push(
                `<strong>Tijd:</strong> ${
                  r.tijd
                } ${
                  timerBtnHtml
                }`
              );

            }


            if (r.moeilijkheid) {

              metaInfo.push(
                `<strong>Moeilijkheid:</strong> ${
                  escapeHtml(
                    r.moeilijkheid
                  )
                }`
              );

            }


            let metaHtml =
              metaInfo.length > 0
                ? `<p>${metaInfo.join(
                    ' &middot; '
                  )}</p>`
                : '';


            return `

              <div
                class="recipe ${
                  i === index

    function startTimer(
      minutes,
      recipeName
    ) {

      if (activeTimer) {

        clearInterval(
          activeTimer
        );

      }


      timeLeft =
        minutes * 60;

      isPaused =
        false;

      currentRecipeName =
        recipeName;


      const banner =
        document.getElementById(
          "timerBanner"
        );


      banner.style.display =
        "block";


      document.getElementById(
        "timerPauseBtn"
      ).textContent =
        "Pauze";


      updateTimerDisplay();


      activeTimer =
        setInterval(
          () => {

            if (!isPaused) {

              if (
                timeLeft <= 0
              ) {

                clearInterval(
                  activeTimer
                );

                activeTimer =
                  null;


                document.getElementById(
                  "timerText"
                ).textContent =
                  `⏰ Tijd is om voor: ${
                    currentRecipeName
                  }!`;


                alert(
                  `Kookwekker afgelopen voor: ${
                    currentRecipeName
                  }!`
                );


                return;

              }


              timeLeft--;

              updateTimerDisplay();

            }

          },
          1000
        );

    }


    function updateTimerDisplay() {

      let m =
        Math.floor(
          timeLeft / 60
        );

      let s =
        timeLeft % 60;


      document.getElementById(
        "timerText"
      ).textContent =
        `⏱️ Timer (${
          currentRecipeName
        }): ${
          m.toString().padStart(2, '0')
        }:${
          s.toString().padStart(2, '0')
        }`;

    }


    function togglePauseTimer() {

      isPaused =
        !isPaused;


      const pauseBtn =
        document.getElementById(
          "timerPauseBtn"
        );


      pauseBtn.textContent =
        isPaused
          ? "Hervat"
          : "Pauze";

    }


    function stopTimer() {

      if (activeTimer) {

        clearInterval(
          activeTimer
        );

      }


      activeTimer =
        null;

      isPaused =
        false;


      document.getElementById(
        "timerBanner"
      ).style.display =
        "none";

    }


    function extractMinutes(
      timeStr
    ) {

      const match =
        timeStr.match(
          /(\d+)\s*min/i
        );


      if (match) {

        return parseInt(
          match[1],
          10
        );

      }


      const pureNum =
        parseInt(
          timeStr,
          10
        );


      return !isNaN(
        pureNum
      )
        ? pureNum
        : 0;

    }

    // =========================================================
    // INGREDIËNTEN PARSEN
    // =========================================================

    function parseIng(
      ingData
    ) {

      if (
        typeof ingData ===
        'string'
      ) {

        try {

          return JSON.parse(
            ingData
          );

        } catch(e) {

          return ingData.split(
            '\n'
          );

        }

      } else if (
        Array.isArray(
          ingData
        )
      ) {

        return ingData;

      }


      return [];

    }


    // =========================================================
    // STAPPEN PARSEN
    // =========================================================

    function parseStepsRaw(
      bData
    ) {

      let bList = [];


      if (
        typeof bData ===
        'string'
      ) {

        try {

          bList =
            JSON.parse(
              bData
            );

        } catch(e) {}

      } else if (
        Array.isArray(
          bData
        )
      ) {

        bList =
          bData;

      }


      let allText = [];


      bList.forEach(
        s => {

          if (s.title) {

            allText.push(
              s.title
            );

          }

          if (
            Array.isArray(
              s.lines
            )
          ) {

            allText.push(
              ...s.lines
            );

          }

        }
      );


      return allText;

    }


    function parseSteps(
      bData
    ) {

      let bList = [];


      if (
        typeof bData ===
        'string'
      ) {

        try {

          bList =
            JSON.parse(
              bData
            );

        } catch(e) {}

      } else if (
        Array.isArray(
          bData
        )
      ) {

        bList =
          bData;

      }


      return bList
        .map(
          (s, idx) => {

            let lines =
              Array.isArray(
                s.lines
              )
                ? s.lines
                : [s.lines];


            let linesHtml =
              lines
                .filter(
                  l =>
                    l &&
                    l.trim() !== ""
                )
                .map(
                  line =>
                    `<li>${line}</li>`
                )
                .join("");


            if (!linesHtml) {

              return "";

            }


            return `

              <div
                class="step-frame"
              >

                <div
                  class="step-header"
                >

                  <span
                    class="step-number-kader"
                  >
                    ${idx + 1}.
                  </span>

                  <span
                    class="step-title-display"
                  >
                    ${
                      s.title ||
                      'Stap'
                    }
                  </span>

                </div>


                <ul
                  class="step-list"
                >
                  ${linesHtml}
                </ul>

              </div>

            `;

          }
        )
        .join("");

    }

    // =========================================================

    async function moveToTrash(
      id
    ) {

      if (
        !confirm(
          "Weet je zeker dat je dit recept naar de prullenbak wilt verplaatsen?"
        )
      ) {

        return;

      }


      const recipeToMove =
        recipes.find(
          r =>
            r.id === id
        );


      if (!recipeToMove) {

        return;

      }


      trashRecipes.push(
        recipeToMove
      );


      localStorage.setItem(
        'myTrashRecipes',
        JSON.stringify(
          trashRecipes
        )
      );


      const {
        error: deleteError
      } =
        await db
          .from('recepten')
          .delete()
          .eq(
            'id',
            id
          );


      if (deleteError) {

        alert(
          "Fout bij opschonen: " +
          deleteError.message
        );

        return;

      }


      fetchRecipes();

    }


    // =========================================================
    // RECEPT TERUGZETTEN
    // =========================================================

    async function restoreRecipe(
      localIdx
    ) {

      const recipeToRestore =
        trashRecipes[
          localIdx
        ];


      if (!recipeToRestore) {

        return;

      }


      delete recipeToRestore.id;


      const {
        error: insertError
      } =
        await db
          .from('recepten')
          .insert([
            recipeToRestore
          ]);


      if (insertError) {

        alert(
          "Fout bij terugzetten: " +
          insertError.message
        );

        return;

      }


      trashRecipes.splice(
        localIdx,
        1
      );


      localStorage.setItem(
        'myTrashRecipes',
        JSON.stringify(
          trashRecipes
        )
      );


      fetchRecipes();

    }

    function renderAlphabetNav(
      gefilterde

      const navContainer =
        document.getElementById(
          "alphabetNav"
        );


      navContainer.innerHTML =
        "";


      const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          .split("");


      alphabet.forEach(
        letter => {

          const btn =
            document.createElement(
              "button"
            );


          btn.className =
            "alphabet-btn";


          btn.textContent =
            letter;


          const hasRecipe =
            gefilterde.some(
              r =>
                r.titel &&
                r.titel
                  .toUpperCase()
                  .startsWith(
                    letter
                  )
            );


          if (!hasRecipe) {

            btn.disabled =
              true;

          } else {

            btn.onclick =
              () => {

                const foundIndex =
                  gefilterde.findIndex(
                    r =>
                      r.titel &&
                      r.titel
                        .toUpperCase()
                        .startsWith(
                          letter
                        )
                  );


                if (
                  foundIndex !==
                  -1
                ) {

                  index =
                    foundIndex;

                  renderApp();

                }

              };

          }


          navContainer.appendChild(
            btn
          );

        }
      );

    }

              )
            : recipe.bereiding;

      } catch(e) {

        bList = [];

      }


      if (
        Array.isArray(bList) &&
        bList.length > 0
      ) {

        bList.forEach(
          s => {

            let linesStr =
              Array.isArray(
                s.lines

                    s.lines ||
                    ""
                  );

              s.title ||

            );

        addStepInput();

        "addForm"

        ).value.trim();


      const moeilijkheid =
        document.getElementById(
          "newDifficulty"
        ).value.trim();


      const ingText =
        document.getElementById(
          "newIngredients"
        ).value;


      const ingredientenArray =
        ingText
          .split("\n")
          .map(
            x =>
              x.trim()
          )
          .filter(
            x =>
              x
          );


      const bereidingArray =
        [];


      document
        .querySelectorAll(
          ".step-input-group"
        )
        .forEach(
          group => {

            const title =
              group
                .querySelector(
                  ".step-title"
                )
                .value
                .trim();


            const descText =
              group
                .querySelector(
                  ".step-lines"
                )
                .value;


            const descLines =
              descText
                .split("\n")
                .map(
                  x =>
                    x.trim()
                )
                .filter(
                  x =>
                    x
                );


            if (
              title ||
              descLines.length > 0
            ) {

              bereidingArray.push({
                title:
                  title ||
                  "Stap",

                lines:
                  descLines
              });

            }

          }
        );


      if (!titel) {

        alert(
          "Vul op zijn minst een titel in."
        );

        return;

      }


      const payload = {

        titel,

        categorie,

        tijd,

        moeilijkheid,

        ingredienten:
          JSON.stringify(
            ingredientenArray
          ),

        bereiding:
          JSON.stringify(
            bereidingArray
          )

      };


      let error;


      if (editId) {

        const res =
          await db
            .from('recepten')
            .update(
              payload
            )
            .eq(
              'id',
              editId
            );


        error =
          res.error;

      } else {

        const res =
          await db
            .from('recepten')
            .insert([
              payload
            ]);


        error =
          res.error;

      }


      if (error) {

        alert(
          "Fout: " +
          error.message
        );

        return;

      }


      alert(
        editId
          ? "Recept succesvol bijgewerkt!"
          : "Recept succesvol opgeslagen!"
      );


      document.getElementById(
        "addForm"
      ).classList.remove(
        "show"
      );


      fetchRecipes();

    }


    // =========================================================
    // VOLGENDE / VORIGE
    // =========================================================

    document.getElementById(
      "next"
    ).onclick =
      () => {

        const gefilterde =
          gefilterdeForCurrentView();


        if (
          gefilterde.length === 0
        ) {

          return;

        }


        index =
          (
            index + 1
          ) %
          gefilterde.length;


        renderApp();

      };


    document.getElementById(
      "prev"
    ).onclick =
      () => {

        const gefilterde =
          gefilterdeForCurrentView();


        if (
          gefilterde.length === 0
        ) {

          return;

        }


        index =
          (
            index - 1 +
            gefilterde.length
          ) %
          gefilterde.length;


        renderApp();

      };

  </script>

      'serviceWorker' in navigator
    ) {

      window.addEventListener(

          navigator.serviceWorker
            .register(
              './sw.js'
            )

            .then(
              function (
                registration
              ) {

                console.log(
                  'Service worker geregistreerd:',
                  registration.scope
                );

              }
            )

            .catch(
              function (
                error
              ) {

                console.error(
                  'Service worker registratie mislukt:',
                  error
                );

              }
            );

        }
      );

    }

  </script>
