<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Landen receptenboek</title>
  <!-- PWA Manifestkoppeling -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#211d1d">
  
  <!-- Supabase Client Library met cache-buster -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=3"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
    }

    .carousel {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Moderne App-Card stijl */
    .recipe {
      display: none;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      text-align: left;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .recipe.active {
      display: block;
      opacity: 1;
    }

    .recipe h2 {
      color: #fff;
      margin-top: 0;
    }

    .recipe h3 {
      color: #ab7c7c;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
    }

    /* Knoppen geoptimaliseerd voor aanraking */
    .nav-btn, .copy-btn, .edit-btn, .delete-btn, .shop-btn, #toggleAdd, #toggleTrash {
      background: #ab7c7c;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
      margin-right: 6px;
    }

    .nav-btn:active, .copy-btn:active, .edit-btn:active, .delete-btn:active, .shop-btn:active, #toggleAdd:active, #toggleTrash:active {
      transform: scale(0.97);
      background: #8f6565;
    }

    .delete-btn {
      background: #d9534f;
    }
    .delete-btn:active {
      background: #c9302c;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2d2d2d;
      color: #fff;
      margin-bottom: 1rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    #search::placeholder {
      color: #888;
    }

    /* Alfabet navigatie styling */
    .alphabet-nav {
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .alphabet-btn {
      background: #2d2d2d;
      color: #ab7c7c;
      border: 1px solid #ab7c7c;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .alphabet-btn:hover:not(:disabled) {
      background: #ab7c7c;
      color: #fff;
    }

    .alphabet-btn:disabled {
      background: #222;
      color: #555;
      border-color: #333;
      cursor: not-allowed;
    }

    /* Stappen kaders styling */
    .steps-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .step-frame {
      background-color: #363636;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
    }

    .step-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #444;
      padding-bottom: 0.4rem;
    }

    .step-number-kader {
      font-weight: bold;
      color: #ab7c7c;
      margin-right: 0.8rem;
      font-size: 1.1rem;
    }

    .step-title-display {
      font-weight: bold;
      color: #fff;
      font-size: 1.05rem;
    }

    .step-list {
      margin: 0;
      padding-left: 1.2rem;
      color: #ccc;
      line-height: 1.5;
    }

    .step-list li {
      margin-bottom: 0.4rem;
      text-align: left;
    }

    .top-actions {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Formulier */
    #addForm {
      max-width: 600px;
      margin: 2rem auto;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      text-align: left;
      display: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #addForm.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #addForm h2 {
      color: #fff;
    }

    #addForm label {
      color: #ccc;
    }

    #addForm input, #addForm textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #363636;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .step-input-group {
      background: #363636;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }

    .remove-step-btn {
      background: #d9534f;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .add-step-btn {
      background: #555;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    #addForm button[onclick="saveRecipe()"] {
      background: #ab7c7c;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      display: block;
      width: 100%;
      margin-top: 1rem;
    }

    .counter {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      color: #aaa;
    }

    /* Boodschappenlijst & Prullenbak Popups */
    #shoppingListPopup, #trashPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2d2d2d;
      color: #e0e0e0;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      text-align: left;
      z-index: 1000;
      border: 1px solid #444;
    }

    #shoppingListPopup.show, #trashPopup.show {
      display: block;
    }

    .close-popup-btn {
      margin-top: 1rem;
      background: #ab7c7c;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .trash-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #363636;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid #444;
    }

    .restore-btn {
      background: #5cb85c;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Landen recepten</h1>
  <p>Scroll door je recepten of kies een letter.</p>

  <input type="text" id="search" placeholder="Zoek een recept...">

  <!-- Alfabet navigatiebalk -->
  <div class="alphabet-nav" id="alphabetNav"></div>

  <div class="top-actions">
    <button id="toggleAdd" onclick="toggleForm()">Recept toevoegen</button>
    <button id="toggleTrash" onclick="openTrash()">🗑️ Prullenbak</button>
  </div>

  <div id="addForm">
    <h2 id="formTitle">Nieuw recept</h2>

    <input type="text" id="newTitle" placeholder="Titel van recept">
    <input type="text" id="newTime" placeholder="Bereidingstijd (bijv. 20 min)">
    <input type="text" id="newDifficulty" placeholder="Moeilijkheid">

    <textarea id="newIngredients" placeholder="Ingrediënten (één per regel)" rows="5"></textarea>
    
    <label><strong>Bereidingsstappen:</strong></label>
    <div id="stepsInputContainer" style="margin-top: 0.5rem;"></div>
    <button type="button" class="add-step-btn" onclick="addStepInput()">+ Stap toevoegen</button>

    <button onclick="saveRecipe()">Opslaan</button>
  </div>

  <div class="carousel" id="carousel">
    <div style="padding: 20px; color: #888;">Recepten laden uit Supabase...</div>
  </div>

  <div>
    <button id="prev" class="nav-btn">◀ Vorige</button>
    <button id="next" class="nav-btn">Volgende ▶</button>
    <div class="counter" id="counter"></div>
  </div>

  <!-- Boodschappenlijst popup -->
  <div id="shoppingListPopup">
    <h2>Boodschappenlijst</h2>
    <ul id="shoppingList"></ul>
    <button class="close-popup-btn" onclick="closeShoppingList()">Sluiten</button>
  </div>

  <!-- Prullenbak popup -->
  <div id="trashPopup">
    <h2>Verwijderde recepten</h2>
    <div id="trashList"><p style="color: #888;">Prullenbak is leeg.</p></div>
    <button class="close-popup-btn" onclick="closeTrash()">Sluiten</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://tnwdxmzvrmfwpwhcmkto.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let recipes = [];
    let trashRecipes = [];
    let index = 0;
    let isEditing = false;
    let editId = null;

    async function fetchRecipes() {
      const { data, error } = await db.from('recepten').select('*');
      
      if (error) {
        console.error('Fout bij ophalen:', error.message);
        document.getElementById('carousel').innerHTML = '<p>Kon recepten niet laden uit de database.</p>';
        return;
      }

      recipes = data || [];
      renderRecipes();
    }

    async function fetchTrash() {
      const { data, error } = await db.from('prullenbak').select('*');
      if (error) {
        console.error('Fout bij ophalen prullenbak:', error.message);
        return;
      }
      trashRecipes = data || [];
      renderTrashList();
    }

    function toggleForm() {
      const form = document.getElementById("addForm");

      if (form.classList.contains("show")) {
        form.classList.remove("show");
        return;
      }

      isEditing = false;
      editId = null;

      document.getElementById("formTitle").innerText = "Nieuw recept";
      document.getElementById("newTitle").value = "";
      document.getElementById("newTime").value = "";
      document.getElementById("newDifficulty").value = "";
      document.getElementById("newIngredients").value = "";
      
      document.getElementById("stepsInputContainer").innerHTML = "";
      addStepInput("", "");

      form.classList.add("show");
    }

    function addStepInput(title = "", linesText = "") {
      const container = document.getElementById("stepsInputContainer");
      const group = document.createElement("div");
      group.className = "step-input-group";
      group.innerHTML = `
        <input type="text" class="step-title-input" placeholder="Titel van de stap (bijv. Voorbereiding)" value="${title}">
        <textarea class="step-lines-input" placeholder="Elke regel wordt een losse bullet...">${linesText}</textarea>
        <button type="button" class="remove-step-btn" onclick="this.parentElement.remove()">Verwijder stap</button>
      `;
      container.appendChild(group);
    }

    function renderAlphabetNav() {
      const navContainer = document.getElementById("alphabetNav");
      navContainer.innerHTML = "";

      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

      alphabet.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "alphabet-btn";
        btn.textContent = letter;

        const hasRecipe = recipes.some(r => r.titel && r.titel.toUpperCase().startsWith(letter));

        if (!hasRecipe) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            const foundIndex = recipes.findIndex(r => r.titel && r.titel.toUpperCase().startsWith(letter));
            if (foundIndex !== -1) {
              index = foundIndex;
              renderRecipes();
            }
          };
        }

        navContainer.appendChild(btn);
      });
    }

    function renderRecipes() {
      const carousel = document.getElementById("carousel");
      const counter = document.getElementById("counter");
      carousel.innerHTML = "";

      if (recipes.length === 0) {
        carousel.innerHTML = `
          <div class="recipe active" style="text-align: center; padding: 30px 10px;">
            <h2>Geen recepten</h2>
            <p>Er zijn nog geen recepten gevonden in de database.</p>
            <button onclick="toggleForm()">Voeg je eerste recept toe!</button>
          </div>
        `;
        counter.textContent = "Recept 0 van 0";
        renderAlphabetNav();
        return;
      }

      if (index >= recipes.length) index = recipes.length - 1;
      if (index < 0) index = 0;

      recipes.forEach((r, i) => {
        const article = document.createElement("article");
        article.className = "recipe" + (i === index ? " active" : "");

        let stepsHtml = "";
        const stappenData = r.bereiding || r.steps; 
        
        if (stappenData && Array.isArray(stappenData)) {
          stepsHtml = stappenData.map((s, idx) => {
            const lines = s.lines || [];
            const linesHtml = lines.map(line => `<li>${line.replace(/^-\s*/, '')}</li>`).join("");
            return `
              <div class="step-frame">
                <div class="step-header">
                  <span class="step-number-kader">${idx + 1}.</span>
                  <span class="step-title-display">${s.title || 'Stap'}</span>
                </div>
                <ul class="step-list">
                  ${linesHtml}
                </ul>
              </div>
            `;
          }).join("");
        }

        let ingList = [];
        if (Array.isArray(r.ingredienten)) {
          ingList = r.ingredienten;
        } else if (typeof r.ingredienten === 'string') {
          ingList = r.ingredienten.split('\n').filter(x => x.trim());
        }

        const ingredientsHtml = ingList.map(x => `<li>${x}</li>`).join("");

        article.innerHTML = `
          <h2>${r.titel || r.title || 'Naamloos'}</h2>
          <p><strong>Tijd:</strong> ${r.tijd || r.time || '-'} &middot; <strong>Moeilijkheid:</strong> ${r.moeilijkheid || r.difficulty || '-'}</p>

          <h3>Ingrediënten</h3>
          <ul class="step-list">${ingredientsHtml}</ul>

          <button class="copy-btn" onclick="copyIngredients(this)">Ingrediënten kopiëren</button>
          <button class="shop-btn" onclick='generateShoppingList(${JSON.stringify(ingList)})'>Boodschappenlijst</button>
          <button class="edit-btn" onclick="openEditForm(${i})">Aanpassen</button>
          <button class="delete-btn" onclick="moveToTrash(${r.id})">Verwijderen</button>

          <h3>Bereiding</h3>
          <div class="steps-container">
            ${stepsHtml}
          </div>
        `;

        carousel.appendChild(article);
      });

      counter.textContent = `Recept ${index + 1} van ${recipes.length}`;
      renderAlphabetNav();
    }

    function openEditForm(i) {
      isEditing = true;
      const r = recipes[i];
      editId = r.id;

      document.getElementById("formTitle").innerText = "Recept aanpassen";

      document.getElementById("newTitle").value = r.titel || r.title || "";
      document.getElementById("newTime").value = r.tijd || r.time || "";
      document.getElementById("newDifficulty").value = r.moeilijkheid || r.difficulty || "";
      
      let ingText = "";
      if (Array.isArray(r.ingredienten)) {
        ingText = r.ingredienten.join("\n");
      } else if (typeof r.ingredienten === 'string') {
        ingText = r.ingredienten;
      }
      document.getElementById("newIngredients").value = ingText;

      const stepsContainer = document.getElementById("stepsInputContainer");
      stepsContainer.innerHTML = "";
      
      const stappenData = r.bereiding || r.steps;
      if (stappenData && Array.isArray(stappenData)) {
        stappenData.forEach(step => {
          let linesStr = "";
          if (step.lines) {
            linesStr = step.lines.map(l => l.replace(/^-\s*/, '')).join("\n");
          }
          addStepInput(step.title || "", linesStr);
        });
      } else {
        addStepInput("", "");
      }

      document.getElementById("addForm").classList.add("show");
    }

    async function saveRecipe() {
      const titel = document.getElementById("newTitle").value.trim();
      const tijd = document.getElementById("newTime").value.trim();
      const moeilijkheid = document.getElementById("newDifficulty").value.trim();
      const ingredienten = document.getElementById("newIngredients").value.split("\n").map(x => x.trim()).filter(x => x);
      
      const stepGroups = document.querySelectorAll(".step-input-group");
      const bereiding = [];

      stepGroups.forEach(group => {
        const stepTitle = group.querySelector(".step-title-input").value.trim();
        const linesText = group.querySelector(".step-lines-input").value;
        const lines = linesText.split("\n").map(x => x.trim().replace(/^-\s*/, '')).filter(x => x);

        if (stepTitle || lines.length > 0) {
          bereiding.push({ title: stepTitle || "Stap", lines: lines });
        }
      });

      if (!titel || !tijd || !moeilijkheid || ingredienten.length === 0 || bereiding.length === 0) {
        alert("Vul alle hoofdvelden in en zorg voor ten minste één geldige stap.");
        return;
      }

      if (!isEditing) {
        const { error } = await db.from('recepten').insert([
          { titel, tijd, moeilijkheid, ingredienten, bereiding }
        ]);

        if (error) {
          alert('Fout bij opslaan: ' + error.message);
          return;
        }
        alert("Recept toegevoegd!");
      } else {
        const { error } = await db.from('recepten')
          .update({ titel, tijd, moeilijkheid, ingredienten, bereiding })
          .eq('id', editId);

        if (error) {
          alert('Fout bij bijwerken: ' + error.message);
          return;
        }
        alert("Recept aangepast!");
      }

      document.getElementById("addForm").classList.remove("show");
      fetchRecipes();
    }

    async function moveToTrash(id) {
      const recipeToMove = recipes.find(r => r.id === id);
      if (!recipeToMove) return;

      if (!confirm(`Weet je zeker dat je "${recipeToMove.titel}" naar de prullenbak wilt verplaatsen?`)) return;

      const { error: insertError } = await db.from('prullenbak').insert([{
        origineel_id: recipeToMove.id,
        titel: recipeToMove.titel,
        tijd: recipeToMove.tijd,
        moeilijkheid: recipeToMove.moeilijkheid,
        ingredienten: recipeToMove.ingredienten,
        bereiding: recipeToMove.bereiding
      }]);

      if (insertError) {
        alert('Fout bij verplaatsen naar prullenbak: ' + insertError.message);
        return;
      }

      const { error: deleteError } = await db.from('recepten').delete().eq('id', id);

      if (deleteError) {
        alert('Fout bij opschonen: ' + deleteError.message);
      } else {
        fetchRecipes();
        fetchTrash();
      }
    }

    async function restoreRecipe(trashId) {
      const itemToRestore = trashRecipes.find(t => t.id === trashId);
      if (!itemToRestore) return;

      const { error: insertError } = await db.from('recepten').insert([{
        titel: itemToRestore.titel,
        tijd: itemToRestore.tijd,
        moeilijkheid: itemToRestore.moeilijkheid,
        ingredienten: itemToRestore.ingredienten,
        bereiding: itemToRestore.bereiding
      }]);

      if (insertError) {
        alert('Fout bij terugzetten: ' + insertError.message);
        return;
      }

      const { error: deleteError } = await db.from('prullenbak').delete().eq('id', trashId);

      if (deleteError) {
        alert('Fout bij opschonen prullenbak: ' + deleteError.message);
      } else {
        alert(`"${itemToRestore.titel}" is hersteld!`);
        fetchRecipes();
        fetchTrash();
      }
    }

    function renderTrashList() {
      const trashList = document.getElementById("trashList");
      if (trashRecipes.length === 0) {
        trashList.innerHTML = '<p style="color: #888;">Prullenbak is leeg.</p>';
        return;
      }

      trashList.innerHTML = trashRecipes.map(t => `
        <div class="trash-item">
          <span><strong>${t.titel}</strong></span>
          <button class="restore-btn" onclick="restoreRecipe(${t.id})">Herstel</button>
        </div>
      `).join("");
    }

    function openTrash() {
      fetchTrash();
      document.getElementById("trashPopup").classList.add("show");
    }

    function closeTrash() {
      document.getElementById("trashPopup").classList.remove("show");
    }

    function copyIngredients(btn) {
      const recipe = btn.closest(".recipe");
      const items = [...recipe.querySelectorAll(".step-list li")].map(li => "- " + li.innerText);
      navigator.clipboard.writeText(items.join("\n")).then(() => {
        alert("Ingrediënten gekopieerd!");
      });
    }

    document.getElementById("next").onclick = () => {
      if (recipes.length === 0) return;
      index = (index + 1) % recipes.length;
      renderRecipes();
    };

    document.getElementById("prev").onclick = () => {
      if (recipes.length === 0) return;
      index = (index - 1 + recipes.length) % recipes.length;
      renderRecipes();
    };

    document.getElementById("search").addEventListener("input", function() {
      const term = this.value.toLowerCase().trim();
      if (!term) {
        index = 0;
        renderRecipes();
        return;
      }

      const foundIndex = recipes.findIndex(r => {
        const stepsText = (r.bereiding || r.steps || []).map(s => (s.title || "") + " " + (s.lines || []).join(" ")).join(" ");
        const fullText = (r.titel || r.title || "") + " " + (r.tijd || r.time || "") + " " + (r.moeilijkheid || r.difficulty || "") + " " +
                         (Array.isArray(r.ingredienten) ? r.ingredienten.join(" ") : (r.ingredienten || "")) + " " + stepsText;
        return fullText.toLowerCase().includes(term);
      });

      if (foundIndex !== -1) {
        index = foundIndex;
        renderRecipes();
      }
    });

    function generateShoppingList(ingredients) {
      const popup = document.getElementById("shoppingListPopup");
      const list = document.getElementById("shoppingList");

      list.innerHTML = ingredients.map(x => `<li>${x}</li>`).join("");
      popup.classList.add("show");
    }

    function closeShoppingList() {
      document.getElementById("shoppingListPopup").classList.remove("show");
    }

    fetchRecipes();
    fetchTrash();
  </script>
