<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptenboek</title>
  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    .show { display: block !important; }
    #addForm, #shoplistView { display: none; background: #2d2d2d; padding: 20px; border-radius: 10px; margin-top: 20px; }
    button { padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Receptenboek</h1>

  <!-- Bedieningsknoppen -->
  <div style="margin-bottom: 20px;">
    <button id="btn-add" onclick="openAddForm()">+ Recept toevoegen</button>
    <button id="btn-shop" onclick="toggleShoplistView()">🛒 Boodschappenlijst</button>
    <button id="btn-trash" onclick="toggleTrashView()">🗑️ Prullenbak</button>
  </div>

  <div id="addForm">
    <h2>Nieuw recept</h2>
    <input type="text" id="newTitle" placeholder="Titel">
    <button onclick="saveRecipe()">Opslaan</button>
  </div>

  <div id="shoplistView">
    <h2>Boodschappenlijst</h2>
  </div>

  <div id="trashView">
    <h2>Prullenbak</h2>
  </div>

  <script>
    // 1. GLOBALE VARIABELEN (Duidelijk gedefinieerd)
    var recipes = [];
    var trashRecipes = [];
    var shoppingList = [];
    var inTrashView = false;
    var inShoplistView = false;
    var db = null;

    // 2. SUPABASE INITIALISATIE (Hardcoded om fouten uit te sluiten)
    try {
      // Directe initialisatie zodra de library geladen is
      db = supabase.createClient(
        'https://tnwdxmzvrmfwpwhcmkto.supabase.co',
        'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX'
      );
      console.log("Supabase verbonden.");
    } catch (err) {
      console.error("Supabase initialisatie fout:", err);
    }

    // 3. FUNCTIES (Veilig geplaatst in de globale scope)
    function openAddForm() {
      // Reset andere views
      inTrashView = false;
      inShoplistView = false;
      document.getElementById('shoplistView').classList.remove('show');
      
      const form = document.getElementById('addForm');
      form.classList.toggle('show');
    }

    function toggleShoplistView() {
      inShoplistView = !inShoplistView;
      inTrashView = false;
      document.getElementById('addForm').classList.remove('show');
      
      const shopDiv = document.getElementById('shoplistView');
      if (inShoplistView) {
        shopDiv.classList.add('show');
      } else {
        shopDiv.classList.remove('show');
      }
    }

    function toggleTrashView() {
      inTrashView = !inTrashView;
      inShoplistView = false;
      document.getElementById('addForm').classList.remove('show');
      
      const trashDiv = document.getElementById('trashView');
      if (inTrashView) {
        trashDiv.classList.add('show');
      } else {
        trashDiv.classList.remove('show');
      }
    }

    async function saveRecipe() {
      if (!db) { alert("Database niet geladen!"); return; }
      const title = document.getElementById('newTitle').value;
      const { data, error } = await db.from('recepten').insert([{ titel: title }]);
      if (error) {
        alert("Fout bij opslaan: " + error.message);
      } else {
        alert("Opgeslagen!");
        document.getElementById('addForm').classList.remove('show');
      }
    }

    // Direct ophalen bij start
    if (db) {
      db.from('recepten').select('*').then(({ data }) => {
        recipes = data || [];
        console.log("Recepten geladen:", recipes.length);
      });
    }
  </script>
</body>
</html>
