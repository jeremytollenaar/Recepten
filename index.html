<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Mijn Receptenboek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=3"></script>
  <style>
    /* ... (Houd je bestaande CSS van de vorige stap hier, en voeg dit onderaan toe) ... */
    .cat-nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .cat-btn {
      background: #363636;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .cat-btn.active {
      background: #ab7c7c;
      border-color: #ab7c7c;
    }
  </style>
</head>
<body>

  <h1>Mijn Recepten</h1>
  
  <!-- Categorie Navigatie -->
  <div class="cat-nav" id="catNav"></div>

  <input type="text" id="search" placeholder="Zoek recept...">
  
  <div class="top-actions">
    <button id="toggleAdd" onclick="toggleForm()">+ Recept</button>
  </div>

  <!-- Rest van je HTML blijft identiek aan de vorige versie -->
  <div class="carousel" id="carousel"></div>
  
  <script>
    const SUPABASE_URL = 'https://tnwdxmzvrmfwpwhcmkto.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let recipes = [];
    let index = 0;
    let huidigeCategorie = "Landen"; // Start categorie
    const categorieën = ["Landen", "Pasta", "Ontbijt", "Dessert"];

    async function fetchRecipes() {
      const { data } = await db.from('recepten').select('*');
      recipes = data || [];
      renderCategorieNav();
      renderRecipes();
    }

    function renderCategorieNav() {
      const nav = document.getElementById("catNav");
      nav.innerHTML = "";
      categorieën.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `cat-btn ${huidigeCategorie === cat ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          huidigeCategorie = cat;
          index = 0;
          renderCategorieNav();
          renderRecipes();
        };
        nav.appendChild(btn);
      });
    }

    function renderRecipes() {
      // Filter alleen op de huidige categorie
      const gefilterde = recipes.filter(r => (r.categorie || "Landen") === huidigeCategorie);
      
      const carousel = document.getElementById("carousel");
      carousel.innerHTML = "";

      if (gefilterde.length === 0) {
        carousel.innerHTML = `<p style="text-align:center; padding:20px;">Geen recepten in ${huidigeCategorie}.</p>`;
        return;
      }

      gefilterde.forEach((r, i) => {
        const article = document.createElement("article");
        article.className = "recipe" + (i === index ? " active" : "");
        // ... (De rest van je render-logica zoals eerder) ...
        article.innerHTML = `<h2>${r.titel}</h2><p>Categorie: ${r.categorie || 'Landen'}</p>...`; 
        carousel.appendChild(article);
      });
      // ... (rest van de functies) ...
    }

    fetchRecipes();
  </script>
</body>
</html>
