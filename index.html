<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Receptenboek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 16px; text-align: center; }
    #addForm { max-width: 600px; margin: 2rem auto; background: #2d2d2d; padding: 20px; border-radius: 16px; text-align: left; display: none; }
    #addForm.show { display: block; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #363636; color: #fff; box-sizing: border-box; }
    .step-input-group { background: #363636; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .nav-btn, .save-recipe-btn, .add-step-btn, .remove-step-btn { background: #ab7c7c; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
    .remove-step-btn { background: #d9534f; }
    .cat-btn { background: #2d2d2d; color: #ab7c7c; border: 1px solid #ab7c7c; padding: 8px; margin: 5px; border-radius: 8px; cursor: pointer; }
    .cat-btn.active { background: #ab7c7c; color: #fff; }
  </style>
</head>
<body>

  <h1>Receptenboek</h1>
  <div id="catNav"></div>
  <button id="toggleAdd" class="nav-btn" onclick="toggleForm()">+ Recept toevoegen</button>

  <div id="addForm">
    <h2>Nieuw recept</h2>
    <input type="text" id="newTitle" placeholder="Titel">
    <input type="text" id="newCat" placeholder="Categorie">
    <textarea id="newIngredients" placeholder="Ingrediënten (per regel)" rows="3"></textarea>
    
    <label>Bereidingsstappen:</label>
    <div id="stepsInputContainer"></div>
    <button type="button" class="add-step-btn" onclick="addStepInput()">+ Stap toevoegen</button>
    <button class="save-recipe-btn" onclick="saveRecipe()" style="width:100%">Opslaan</button>
  </div>

  <div id="carousel"></div>

  <script>
    const db = supabase.createClient('https://tnwdxmzvrmfwpwhcmkto.supabase.co', 'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX');
    let recipes = [];
    let huidigeCategorie = "Landen";

    async function fetchRecipes() {
      const { data } = await db.from('recepten').select('*');
      recipes = data || [];
      renderApp();
    }

    function addStepInput() {
      const container = document.getElementById("stepsInputContainer");
      const div = document.createElement("div");
      div.className = "step-input-group";
      div.innerHTML = `
        <input type="text" class="step-title" placeholder="Titel stap (bijv. Bakken)">
        <textarea class="step-lines" placeholder="Stap beschrijving"></textarea>
        <button type="button" class="remove-step-btn" onclick="this.parentElement.remove()">Verwijderen</button>
      `;
      container.appendChild(div);
    }

    function toggleForm() {
      const form = document.getElementById("addForm");
      form.classList.toggle("show");
      if(form.classList.contains("show")) addStepInput();
    }

    async function saveRecipe() {
      const titel = document.getElementById("newTitle").value;
      const categorie = document.getElementById("newCat").value || "Landen";
      const ingredienten = document.getElementById("newIngredients").value.split("\n");
      
      const bereiding = [];
      document.querySelectorAll(".step-input-group").forEach(group => {
        bereiding.push({
          title: group.querySelector(".step-title").value,
          lines: [group.querySelector(".step-lines").value]
        });
      });

      const { error } = await db.from('recepten').insert([{ titel, categorie, ingredienten, bereiding }]);
      if (error) alert("Fout: " + error.message);
      else { alert("Opgeslagen!"); fetchRecipes(); toggleForm(); }
    }

    function renderApp() {
      const carousel = document.getElementById("carousel");
      carousel.innerHTML = recipes.filter(r => (r.categorie || "Landen") === huidigeCategorie)
        .map(r => `<div><h2>${r.titel}</h2><p>Categorie: ${r.categorie}</p></div>`).join("");
    }

    fetchRecipes();
  </script>
</body>
</html>
