<!DOCTYPE html>
<html lang="nl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Receptenboek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 16px; text-align: center; }
    h1 { color: #fff; margin-bottom: 5px; }
    p { color: #aaa; }

    /* Actieve Timer Banner */
    #timerBanner { display: none; background: #ab7c7c; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 1rem; font-weight: bold; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    /* Categorie & Alfabet Navigatie */
    .cat-nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .cat-pill { display: flex; align-items: center; background: #2d2d2d; border: 1px solid #ab7c7c; border-radius: 8px; overflow: hidden; }
    .cat-pill.active { background: #ab7c7c; }
    .cat-btn { background: transparent; color: #ab7c7c; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; }
    .cat-pill.active .cat-btn { color: #fff; }
    .cat-del-btn { background: transparent; border: none; color: #d9534f; padding: 0 8px; cursor: pointer; font-size: 0.9rem; }
    
    .alphabet-nav { margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 600px; margin-left: auto; margin-right: auto; }
    .alphabet-btn { background: #2d2d2d; color: #ab7c7c; border: 1px solid #ab7c7c; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .alphabet-btn:hover:not(:disabled) { background: #ab7c7c; color: #fff; }
    .alphabet-btn:disabled { background: #222; color: #555; border-color: #333; cursor: not-allowed; }

    #search { width: 100%; max-width: 400px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #2d2d2d; color: #fff; margin-bottom: 1rem; box-sizing: border-box; }

    /* Recept Kaart & Stappen */
    .carousel { max-width: 600px; margin: 0 auto; }
    .recipe { display: none; background: #2d2d2d; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-align: left; margin-bottom: 1rem; }
    .recipe.active { display: block; }
    .recipe h2 { color: #fff; margin-top: 0; }
    .recipe h3 { color: #ab7c7c; border-bottom: 1px solid #444; padding-bottom: 4px; margin-top: 1.2rem; }

    .step-frame { background-color: #363636; border: 1px solid #444; border-radius: 10px; padding: 12px; margin-top: 0.8rem; }
    .step-header { display: flex; align-items: center; margin-bottom: 0.4rem; border-bottom: 1px solid #444; padding-bottom: 0.4rem; }
    .step-number-kader { font-weight: bold; color: #ab7c7c; margin-right: 0.8rem; }
    .step-title-display { font-weight: bold; color: #fff; }
    .step-list { margin: 0; padding-left: 1.2rem; color: #ccc; line-height: 1.5; }

    /* Knoppen & Formulier */
    .nav-btn, .save-recipe-btn, .add-step-btn, .remove-step-btn, .restore-btn, .timer-btn, #toggleAdd, #toggleTrash, #toggleShoplist { background: #ab7c7c; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
    .timer-btn { background: #4a7c59; padding: 4px 8px; font-size: 0.8rem; margin-left: 8px; }
    .remove-step-btn { background: #d9534f; }
    .restore-btn { background: #5cb85c; }
    
    #addForm, #shoplistView { max-width: 600px; margin: 2rem auto; background: #2d2d2d; padding: 20px; border-radius: 16px; text-align: left; display: none; }
    #addForm.show, #shoplistView.show { display: block; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #363636; color: #fff; box-sizing: border-box; }
    .step-input-group { background: #363636; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    
    /* Boodschappenlijst item styling */
    .shop-item { display: flex; align-items: center; gap: 10px; background: #363636; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; }
    .shop-item input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Receptenboek</h1>
  <p id="subTitle">Kies een categorie of blader door je recepten.</p>

  <!-- Actieve Timer Banner -->
  <div id="timerBanner"></div>

  <!-- Categorie Navigatie -->
  <div class="cat-nav" id="catNav"></div>

  <input type="text" id="search" placeholder="Zoek op titel, ingrediënt of categorie..." oninput="renderApp()">

  <!-- Alfabet navigatie -->
  <div class="alphabet-nav" id="alphabetNav"></div>

  <div style="margin-bottom: 1.5rem;">
    <button id="toggleAdd" onclick="toggleForm()">+ Recept toevoegen</button>
    <button id="toggleShoplist" onclick="toggleShoplistView()">🛒 Boodschappenlijst (0)</button>
    <button id="toggleTrash" onclick="toggleTrashView()">🗑️ Prullenbak (0)</button>
  </div>

  <!-- Boodschappenlijst Scherm -->
  <div id="shoplistView">
    <h2>Boodschappenlijst</h2>
    <p style="font-size: 0.85rem; color: #aaa;">Vink aan wat je nodig hebt en zet op je lijst:</p>
    <div id="shoplistIngredientsContainer" style="margin-bottom: 15px; max-height: 250px; overflow-y: auto;"></div>
    <h3 style="margin-top: 1rem; color:#fff;">Jouw actieve lijst:</h3>
    <ul id="finalShoplist" class="step-list" style="margin-bottom: 15px;"></ul>
    <button class="remove-step-btn" onclick="clearShoplist()" style="width:100%">Lijst leegmaken</button>
  </div>

  <div id="addForm">
    <h2>Nieuw recept</h2>
    <input type="text" id="newTitle" placeholder="Titel van recept">
    <input type="text" id="newCat" placeholder="Categorie (bijv. Pasta, Salade)" list="catList">
    <datalist id="catList"></datalist>
    <input type="text" id="newTime" placeholder="Bereidingstijd (bijv. 20 min)">
    <input type="text" id="newDifficulty" placeholder="Moeilijkheid (bijv. Makkelijk)">
    
    <textarea id="newIngredients" placeholder="Ingrediënten (één per regel)" rows="4"></textarea>
    
    <label style="font-weight: bold; color: #ccc;">Bereidingsstappen:</label>
    <div id="stepsInputContainer" style="margin-top: 0.5rem;"></div>
    <button type="button" class="add-step-btn" onclick="addStepInput()">+ Stap toevoegen</button>
    
    <button class="save-recipe-btn" onclick="saveRecipe()" style="width:100%">Opslaan</button>
  </div>

  <div class="carousel" id="carousel"></div>

  <div style="margin-top: 20px;" id="paginationContainer">
    <button id="prev" class="nav-btn">◀ Vorige</button>
    <button id="next" class="nav-btn">Volgende ▶</button>
    <div id="counter" style="margin-top: 10px; color: #aaa;"></div>
  </div>

  <script>
    const db = supabase.createClient('https://tnwdxmzvrmfwpwhcmkto.supabase.co', 'sb_publishable_XSvvA17awR2CAX-Xd-sfkQ_H-OVZ_sX');
    let recipes = [];
    let trashRecipes = [];
    let shoppingList = JSON.parse(localStorage.getItem('myShoplist') || '[]');
    let index = 0;
    let huidigeCategorie = "Overig";
    let inTrashView = false;
    let inShoplistView = false;

    // Timer variabelen
    let activeTimer = null;
    let timeLeft = 0;

    async function fetchRecipes() {
      const { data, error } = await db.from('recepten').select('*');
      if (error) { console.error(error); return; }
      recipes = data || [];

      const { data: trashData, error: trashError } = await db.from('prullenbak').select('*');
      if (!trashError) {
        trashRecipes = trashData || [];
      } else {
        console.warn("Kon prullenbak tabel niet laden:", trashError.message);
      }

      document.getElementById("toggleTrash").textContent = `🗑️ Prullenbak (${trashRecipes.length})`;
      updateShoplistCount();
      renderApp();
    }

    function renderApp() {
      const searchTerm = document.getElementById("search").value.toLowerCase().trim();
      const catNavElement = document.getElementById("catNav");
      const alphabetNavElement = document.getElementById("alphabetNav");
      const paginationElement = document.getElementById("paginationContainer");
      const addFormElement = document.getElementById("addForm");
      const shoplistElement = document.getElementById("shoplistView");

      if (inTrashView || inShoplistView) {
        catNavElement.style.display = "none";
        alphabetNavElement.style.display = "none";
        paginationElement.style.display = "none";
        addFormElement.classList.remove("show");
        if (inTrashView) {
          document.getElementById("subTitle").textContent = "Verwijderde recepten in de prullenbak:";
          shoplistElement.classList.remove("show");
          renderTrashList(searchTerm);
        } else {
          document.getElementById("subTitle").textContent = "Jouw geselecteerde boodschappenlijst:";
          renderShoplistUI();
        }
        return;
      } else {
        catNavElement.style.display = "flex";
        alphabetNavElement.style.display = "flex";
        shoplistElement.classList.remove("show");
        document.getElementById("subTitle").textContent = "Kies een categorie of blader door je recepten.";
        paginationElement.style.display = "block";
      }

      let cats = [...new Set(recipes.map(r => r.categorie).filter(c => c && c.trim() !== ""))];
      if (cats.length === 0) cats = ["Overig"];
      
      if (cats.includes("Overig")) {
        cats = cats.filter(c => c !== "Overig");
        cats.push("Overig");
      }

      if (!cats.includes(huidigeCategorie)) huidigeCategorie = cats[0];

      document.getElementById("catNav").innerHTML = cats.map(c => `
        <div class="cat-pill ${huidigeCategorie === c ? 'active' : ''}">
          <button class="cat-btn" onclick="selectCategory('${c}')">${c}</button>
          ${c !== "Overig" ? `<button class="cat-del-btn" onclick="verwijderCategorie(event, '${c}')" title="Verwijder categorie">🗑️</button>` : ''}
        </div>
      `).join("");

      document.getElementById("catList").innerHTML = cats.map(c => `<option value="${c}">`).join("");

      let gefilterde = [];
      if (searchTerm) {
        gefilterde = recipes.filter(r => {
          const titelMatch = r.titel && r.titel.toLowerCase().includes(searchTerm);
          const catMatch = r.categorie && r.categorie.toLowerCase().includes(searchTerm);
          
          let ingString = "";
          try {
            let parsedIng = parseIng(r.ingredienten);
            ingString = parsedIng.join(" ").toLowerCase();
          } catch(e) {
            ingString = (r.ingredienten || "").toLowerCase();
          }
          const ingMatch = ingString.includes(searchTerm);

          let stepString = "";
          try {
            let parsedSteps = parseStepsRaw(r.bereiding);
            stepString = parsedSteps.join(" ").toLowerCase();
          } catch(e) {
            stepString = (r.bereiding || "").toLowerCase();
          }
          const stepMatch = stepString.includes(searchTerm);

          return titelMatch || catMatch || ingMatch || stepMatch;
        });
      } else {
        gefilterde = recipes.filter(r => (r.categorie || "Overig") === huidigeCategorie);
      }

      renderAlphabetNav(gefilterde);

      const carousel = document.getElementById("carousel");
      const counter = document.getElementById("counter");

      if (gefilterde.length === 0) {
        carousel.innerHTML = `<div class="recipe active"><p>Geen recepten gevonden.</p></div>`;
        counter.textContent = "";
        return;
      }

      if (index >= gefilterde.length) index = 0;

      carousel.innerHTML = gefilterde.map((r, i) => {
        let ingList = parseIng(r.ingredienten);
        let ingHtml = ingList.map(x => `<li>${x.replace(/["\[\]]/g, '')}</li>`).join("");
        let stepsHtml = parseSteps(r.bereiding);

        let metaInfo = [];
        if (r.categorie) metaInfo.push(`<strong>Categorie:</strong> ${r.categorie}`);
        
        // Bereidingstijd inclusief timer knop indien er minuten in staan
        if (r.tijd) {
          let minutes = extractMinutes(r.tijd);
          let timerBtnHtml = minutes > 0 ? `<button class="timer-btn" onclick="startTimer(${minutes}, '${r.titel}')">⏱️ Start (${minutes}m)</button>` : '';
          metaInfo.push(`<strong>Tijd:</strong> ${r.tijd} ${timerBtnHtml}`);
        }

        if (r.moeilijkheid) metaInfo.push(`<strong>Moeilijkheid:</strong> ${r.moeilijkheid}`);
        let metaHtml = metaInfo.length > 0 ? `<p>${metaInfo.join(' &middot; ')}</p>` : '';

        // Veilige string voor objectdoorgifte naar boodschappenlijst
        const safeIngredientsJSON = JSON.stringify(ingList).replace(/"/g, '&quot;');

        return `
        <div class="recipe ${i === index ? 'active' : ''}">
            <h2>${r.titel || 'Naamloos Recept'}</h2>
            ${metaHtml}
            <h3>Ingrediënten</h3>
            <ul class="step-list">${ingHtml || '<li>Geen ingrediënten.</li>'}</ul>
            <button class="nav-btn" onclick='openShoplistModal(${safeIngredientsJSON})' style="margin-top:10px; font-size:0.85rem; padding:6px 10px;">🛒 Voeg toe aan boodschappenlijst</button>
            <h3>Bereiding</h3>
            <div style="margin-top:10px;">${stepsHtml || '<p style="color:#aaa;">Geen stappen.</p>'}</div>
            <button class="remove-step-btn" onclick="moveToTrash(${r.id})" style="margin-top: 20px;">Verwijderen</button>
        </div>`;
      }).join("");

      counter.textContent = `Recept ${index + 1} van ${gefilterde.length}`;
    }

    // Timer Functionaliteit
    function startTimer(minutes, recipeName) {
      if (activeTimer) clearInterval(activeTimer);
      timeLeft = minutes * 60;
      const banner = document.getElementById("timerBanner");
      banner.style.display = "block";

      function updateBanner() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        banner.textContent = `⏱️ Timer (${recipeName}): ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) {
          clearInterval(activeTimer);
          activeTimer = null;
          banner.textContent = `⏰ Tijd is om voor: ${recipeName}!`;
          alert(`Kookwekker afgelopen voor: ${recipeName}!`);
        }
        timeLeft--;
      }

      updateBanner();
      activeTimer = setInterval(updateBanner, 1000);
    }

    function extractMinutes(timeStr) {
      const match = timeStr.match(/(\d+)\s*min/i);
      if (match) return parseInt(match[1], 10);
      const pureNum = parseInt(timeStr, 10);
      return !isNaN(pureNum) ? pureNum : 0;
    }

    // Boodschappenlijst Selectie Modal / Scherm logica
    function openShoplistModal(ingredientsArray) {
      inShoplistView = true;
      document.getElementById("toggleShoplist").textContent = "← Terug naar recepten";
      document.getElementById("addForm").classList.remove("show");
      document.getElementById("shoplistView").classList.add("show");

      const container = document.getElementById("shoplistIngredientsContainer");
      container.innerHTML = `<p style="font-weight:bold; color:#fff; margin-bottom:5px;">Selecteer de ingrediënten:</p>` + 
        ingredientsArray.map((item, idx) => `
          <div class="shop-item">
            <input type="checkbox" id="ing_opt_${idx}" value="${item.replace(/["\[\]]/g, '')}" checked>
            <label for="ing_opt_${idx}" style="cursor:pointer; color:#e0e0e0;">${item.replace(/["\[\]]/g, '')}</label>
          </div>
        `).join('') + `
        <button class="save-recipe-btn" onclick="confirmAddShoplist()" style="width:100%; margin-top:10px;">Voeg aangevinkte toe aan lijst</button>
      `;

      renderShoplistUI();
    }

    function confirmAddShoplist() {
      const checkboxes = document.querySelectorAll("#shoplistIngredientsContainer input[type='checkbox']");
      checkboxes.forEach(cb => {
        if (cb.checked && !shoppingList.includes(cb.value)) {
          shoppingList.push(cb.value);
        }
      });
      localStorage.setItem('myShoplist', JSON.stringify(shoppingList));
      updateShoplistCount();
      alert("Toegevoegd aan je boodschappenlijst!");
      toggleShoplistView(); // terug naar normaal overzicht
    }

    function renderShoplistUI() {
      const finalContainer = document.getElementById("finalShoplist");
      if (shoppingList.length === 0) {
        finalContainer.innerHTML = `<li style="color:#aaa;">Je boodschappenlijst is leeg.</li>`;
        return;
      }

      finalContainer.innerHTML = shoppingList.map((item, idx) => `
        <div class="shop-item" style="justify-content: space-between;">
          <span>${item}</span>
          <button class="remove-step-btn" onclick="removeShoplistItem(${idx})" style="padding: 2px 6px; font-size:0.75rem; margin:0;">Wissen</button>
        </div>
      `).join('');
    }

    function removeShoplistItem(idx) {
      shoppingList.splice(idx, 1);
      localStorage.setItem('myShoplist', JSON.stringify(shoppingList));
      updateShoplistCount();
      renderShoplistUI();
    }

    function clearShoplist() {
      if (!confirm("Weet je zeker dat je de hele boodschappenlijst wilt legen?")) return;
      shoppingList = [];
      localStorage.setItem('myShoplist', JSON.stringify(shoppingList));
      updateShoplistCount();
      renderShoplistUI();
    }

    function updateShoplistCount() {
      document.getElementById("toggleShoplist").textContent = `🛒 Boodschappenlijst (${shoppingList.length})`;
    }

    function toggleShoplistView() {
      inShoplistView = !inShoplistView;
      if (inTrashView) inTrashView = false;
      const btn = document.getElementById("toggleShoplist");
      btn.textContent = inShoplistView ? "← Terug naar recepten" : `🛒 Boodschappenlijst (${shoppingList.length})`;
      index = 0;
      renderApp();
    }

    function toggleTrashView() {
      inTrashView = !inTrashView;
      if (inShoplistView) inShoplistView = false;
      const btn = document.getElementById("toggleTrash");
      btn.textContent = inTrashView ? "← Terug naar recepten" : `🗑️ Prullenbak (${trashRecipes.length})`;
      index = 0;
      renderApp();
    }

    function renderTrashList(searchTerm) {
      const carousel = document.getElementById("carousel");
      let gefilterde = trashRecipes;
      if (searchTerm) {
        gefilterde = gefilterde.filter(r => r.titel && r.titel.toLowerCase().includes(searchTerm));
      }

      if (gefilterde.length === 0) {
        carousel.innerHTML = `<div class="recipe active"><p>De prullenbak is leeg.</p></div>`;
        return;
      }

      carousel.innerHTML = gefilterde.map((r, i) => {
        let ingList = parseIng(r.ingredienten);
        let ingHtml = ingList.map(x => `<li>${x.replace(/["\[\]]/g, '')}</li>`).join("");
        let stepsHtml = parseSteps(r.bereiding);

        return `
        <div class="recipe active" style="margin-bottom: 20px;">
            <h2>🗑️ ${r.titel || 'Naamloos'} <span style="font-size:0.8rem; color:#ab7c7c;">(Categorie: ${r.categorie || 'Overig'})</span></h2>
            <h3>Ingrediënten</h3>
            <ul class="step-list">${ingHtml}</ul>
            <h3>Bereiding</h3>
            <div>${stepsHtml}</div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
              <button class="restore-btn" onclick="restoreRecipe(${r.id})">Terughalen</button>
              <button class="remove-step-btn" onclick="deletePermanent(${r.id})">Definitief wissen</button>
            </div>
        </div>`;
      }).join("");
    }

    function parseIng(ingData) {
      if (typeof ingData === 'string') {
          try { return JSON.parse(ingData); } catch(e) { return ingData.split('\n'); }
      } else if (Array.isArray(ingData)) {
          return ingData;
      }
      return [];
    }

    function parseStepsRaw(bData) {
      let bList = [];
      if (typeof bData === 'string') {
          try { bList = JSON.parse(bData); } catch(e) {}
      } else if (Array.isArray(bData)) {
          bList = bData;
      }
      let allText = [];
      bList.forEach(s => {
        if (s.title) allText.push(s.title);
        if (Array.isArray(s.lines)) allText.push(...s.lines);
      });
      return allText;
    }

    function parseSteps(bData) {
      let bList = [];
      if (typeof bData === 'string') {
          try { bList = JSON.parse(bData); } catch(e) {}
      } else if (Array.isArray(bData)) {
          bList = bData;
      }
      return bList.map((s, idx) => {
          let lines = Array.isArray(s.lines) ? s.lines : [s.lines];
          let linesHtml = lines.filter(l => l && l.trim() !== "").map(line => `<li>${line}</li>`).join("");
          if(!linesHtml) return "";
          return `
          <div class="step-frame">
              <div class="step-header">
                  <span class="step-number-kader">${idx + 1}.</span>
                  <span class="step-title-display">${s.title || 'Stap'}</span>
              </div>
              <ul class="step-list">${linesHtml}</ul>
          </div>`;
      }).join("");
    }

    async function moveToTrash(id) {
      if (!confirm("Weet je zeker dat je dit recept naar de prullenbak wilt verplaatsen?")) return;
      
      const recipeToMove = recipes.find(r => r.id === id);
      if (!recipeToMove) return;

      const { error: insertError } = await db.from('prullenbak').insert([{
        titel: recipeToMove.titel,
        categorie: recipeToMove.categorie,
        tijd: recipeToMove.tijd,
        moeilijkheid: recipeToMove.moeilijkheid,
        ingredienten: recipeToMove.ingredienten,
        bereiding: recipeToMove.bereiding
      }]);

      if (insertError) {
        alert("Fout bij verplaatsen naar prullenbak: " + insertError.message);
        return;
      }

      const { error: deleteError } = await db.from('recepten').delete().eq('id', id);
      if (deleteError) {
        alert("Fout bij opschonen: " + deleteError.message);
        return;
      }

      fetchRecipes();
    }

    async function restoreRecipe(id) {
      const recipeToRestore = trashRecipes.find(r => r.id === id);
      if (!recipeToRestore) return;

      const { error: insertError } = await db.from('recepten').insert([{
        titel: recipeToRestore.titel,
        categorie: recipeToRestore.categorie,
        tijd: recipeToRestore.tijd,
        moeilijkheid: recipeToRestore.moeilijkheid,
        ingredienten: recipeToRestore.ingredienten,
        bereiding: recipeToRestore.bereiding
      }]);

      if (insertError) {
        alert("Fout bij terugzetten: " + insertError.message);
        return;
      }

      const { error: deleteError } = await db.from('prullenbak').delete().eq('id', id);
      if (deleteError) {
        alert("Fout bij opschonen prullenbak: " + deleteError.message);
        return;
      }

      fetchRecipes();
    }

    async function deletePermanent(id) {
      if (!confirm("Wil je dit recept definitief wissen? Dit kan niet ongedaan worden gemaakt.")) return;
      const { error } = await db.from('prullenbak').delete().eq('id', id);
      if (error) alert("Fout: " + error.message);
      else fetchRecipes();
    }

    function renderAlphabetNav(gefilterde) {
      const navContainer = document.getElementById("alphabetNav");
      navContainer.innerHTML = "";
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

      alphabet.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "alphabet-btn";
        btn.textContent = letter;
        const hasRecipe = gefilterde.some(r => r.titel && r.titel.toUpperCase().startsWith(letter));

        if (!hasRecipe) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            const foundIndex = gefilterde.findIndex(r => r.titel && r.titel.toUpperCase().startsWith(letter));
            if (foundIndex !== -1) { index = foundIndex; renderApp(); }
          };
        }
        navContainer.appendChild(btn);
      });
    }

    function selectCategory(cat) { 
      document.getElementById("search").value = ""; 
      huidigeCategorie = cat; 
      index = 0; 
      renderApp(); 
    }

    async function verwijderCategorie(event, cat) {
      event.stopPropagation();
      if (!confirm(`Weet je zeker dat je de categorie '${cat}' wilt verwijderen? De recepten worden verplaatst naar 'Overig'.`)) return;
      
      const { error } = await db.from('recepten').update({ categorie: 'Overig' }).eq('categorie', cat);
      if (error) {
          alert("Fout bij verwijderen: " + error.message);
          return;
      }
      
      huidigeCategorie = "Overig";
      fetchRecipes();
    }

    function addStepInput(title = "", line = "") {
      const container = document.getElementById("stepsInputContainer");
      const div = document.createElement("div");
      div.className = "step-input-group";
      div.innerHTML = `
        <input type="text" class="step-title" placeholder="Titel stap (bijv. Voorbereiding)" value="${title}">
        <textarea class="step-lines" placeholder="Beschrijving (één punt per regel)" rows="3">${line}</textarea>
        <button type="button" class="remove-step-btn" onclick="this.parentElement.remove()">Verwijder stap</button>
      `;
      container.appendChild(div);
    }

    function toggleForm() {
      const form = document.getElementById("addForm");
      if(inShoplistView) { inShoplistView = false; document.getElementById("shoplistView").classList.remove("show"); }
      form.classList.toggle("show");
      if(form.classList.contains("show") && document.getElementById("stepsInputContainer").children.length === 0) {
        addStepInput();
      }
    }

    async function saveRecipe() {
      const titel = document.getElementById("newTitle").value.trim();
      const categorie = document.getElementById("newCat").value.trim() || "Overig";
      const tijd = document.getElementById("newTime").value.trim();
      const moeilijkheid = document.getElementById("newDifficulty").value.trim();
      
      const ingText = document.getElementById("newIngredients").value;
      const ingredientenArray = ingText.split("\n").map(x => x.trim()).filter(x => x);
      
      const bereidingArray = [];
      document.querySelectorAll(".step-input-group").forEach(group => {
        const title = group.querySelector(".step-title").value.trim();
        const descText = group.querySelector(".step-lines").value;
        const descLines = descText.split("\n").map(x => x.trim()).filter(x => x);
        
        if (title || descLines.length > 0) {
          bereidingArray.push({ title: title || "Stap", lines: descLines });
        }
      });

      if (!titel) { alert("Vul op zijn minst een titel in."); return; }

      const payload = { 
        titel, 
        categorie, 
        tijd, 
        moeilijkheid, 
        ingredienten: JSON.stringify(ingredientenArray), 
        bereiding: JSON.stringify(bereidingArray) 
      };

      const { error } = await db.from('recepten').insert([payload]);
      if (error) { alert("Fout: " + error.message); return; }

      alert("Recept succesvol opgeslagen!");
      
      document.getElementById("newTitle").value = "";
      document.getElementById("newCat").value = "";
      document.getElementById("newTime").value = "";
      document.getElementById("newDifficulty").value = "";
      document.getElementById("newIngredients").value = "";
      document.getElementById("stepsInputContainer").innerHTML = "";
      document.getElementById("addForm").classList.remove("show");
      
      fetchRecipes();
    }

    document.getElementById("next").onclick = () => {
      const searchTerm = document.getElementById("search").value.toLowerCase().trim();
      let gefilterde = searchTerm ? recipes.filter(r => (r.titel && r.titel.toLowerCase().includes(searchTerm)) || (r.categorie && r.categorie.toLowerCase().includes(searchTerm))) : recipes.filter(r => (r.categorie || "Overig") === huidigeCategorie);
      if (gefilterde.length === 0) return;
      index = (index + 1) % gefilterde.length;
      renderApp();
    };

    document.getElementById("prev").onclick = () => {
      const searchTerm = document.getElementById("search").value.toLowerCase().trim();
      let gefilterde = searchTerm ? recipes.filter(r => (r.titel && r.titel.toLowerCase().includes(searchTerm)) || (r.categorie && r.categorie.toLowerCase().includes(searchTerm))) : recipes.filter(r => (r.titel && r.titel.toLowerCase().includes(searchTerm)));
      if (gefilterde.length === 0) return;
      index = (index - 1 + gefilterde.length) % gefilterde.length;
      renderApp();
    };

    fetchRecipes();
  </script>
</body>
</html>
